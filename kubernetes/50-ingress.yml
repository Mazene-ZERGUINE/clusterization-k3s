apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: cluster-project
  labels:
    app.kubernetes.io/part-of: cluster-project
spec:
  headers:
    frameDeny: true
    contentTypeNosniff: true
    browserXssFilter: true
    referrerPolicy: strict-origin-when-cross-origin
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compress
  namespace: cluster-project
  labels:
    app.kubernetes.io/part-of: cluster-project
spec:
  compress: {}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  namespace: cluster-project
  labels:
    app.kubernetes.io/part-of: cluster-project
spec:
  rateLimit:
    average: 100
    burst: 50
    period: 1s
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: cluster-project
  labels:
    app.kubernetes.io/part-of: cluster-project
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cluster-project
  namespace: cluster-project
  labels:
    app.kubernetes.io/part-of: cluster-project
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: cluster-project-redirect-https@kubernetescrd,cluster-project-security-headers@kubernetescrd,cluster-project-compress@kubernetescrd,cluster-project-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - cluster-project.local
      secretName: cluster-project-tls
  rules:
    - host: cluster-project.local
      http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  name: http
          - path: /api/products
            pathType: Prefix
            backend:
              service:
                name: product-service
                port:
                  name: http
          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http